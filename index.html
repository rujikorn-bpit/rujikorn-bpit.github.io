<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MANA STORE</title>
  <meta name="theme-color" content="#2B6684">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&family=Prompt:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="page"></div>
  <script src="render.js"></script>
  <script>
    // no-store so a new config.json shows at once after upload
    fetch('config.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(cfg => {
        const name = renderPage(cfg, document.getElementById('page'));
        if (name) document.title = name;
        if (location.hash === '#contacts') document.querySelector('a[href="#contacts"]')?.click();
      })
      .catch(() => {
        document.getElementById('page').textContent = 'Cannot load config.json';
      });
  </script>
</body>
</html>
